<!-- Wave divider artwork. Drawn for Acrylic Pros — the crest and the reef
     silhouettes are original, not traced from any reference site.

     Used as:  a wave-divider wrapper around this partial; see styles.css 07b.
     The modifier on the wrapper sets which band the wave is flowing INTO,
     so the divider reads as that band rising rather than as a stripe.

     ORDER MATTERS. The reef is drawn FIRST and the wave body painted over
     it, so every coral stem can run well below the crest and be clipped by
     the water rather than having to terminate exactly on a curve that
     changes height across the viewBox. It also means the sway pivots from
     a rooted base instead of from the waterline.

     The coral is grouped into three clusters rather than spaced evenly —
     an even rhythm reads as a border, clusters read as a reef.

     Scaling is uniform (no preserveAspectRatio="none"): stretching the box
     to the viewport would smear the coral horizontally on wide screens.

     The drift is the only ambient motion on the site. It is confined to
     decorative illustration, moves by fractions of a degree, and is off
     entirely under prefers-reduced-motion. -->
