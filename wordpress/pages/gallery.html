<!-- Lightbox: moved to the end of <body> by pages.js so the page can go inert.
     Focus is trapped while open, Escape closes, arrow keys and swipe navigate,
     and focus returns to the tile that opened it. -->
<div class="m-lightbox" data-lightbox role="dialog" aria-modal="true" aria-label="Project image viewer" aria-hidden="true" data-lenis-prevent>
  <div class="m-lightbox__bar">
    <span class="m-lightbox__count" data-lightbox-count>1 / 1</span>
    <button class="m-lightbox__btn" type="button" data-lightbox-close aria-label="Close image viewer">
      <svg class="a-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="m-lightbox__stage" data-lightbox-stage>
    <button class="m-lightbox__btn m-lightbox__nav -prev" type="button" data-lightbox-prev aria-label="Previous project">
      <svg class="a-svg" aria-hidden="true"><use href="#i-arrow-right"/></svg>
    </button>
    <img class="m-lightbox__img" data-lightbox-image src="/wp-content/uploads/project-15.jpeg" alt="" width="953" height="720" decoding="async">
    <button class="m-lightbox__btn m-lightbox__nav -next" type="button" data-lightbox-next aria-label="Next project">
      <svg class="a-svg" aria-hidden="true"><use href="#i-arrow-right"/></svg>
    </button>
  </div>
  <div class="m-lightbox__foot">
    <p class="m-lightbox__title" data-lightbox-title></p>
    <p class="m-lightbox__hint">Use the arrow keys to move between projects, or press Escape to close.</p>
  </div>
</div>
