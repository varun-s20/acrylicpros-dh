<div class="m-chat" data-chat>
  <div class="m-chat__panel" id="chat-panel" role="dialog" aria-modal="false" aria-labelledby="chat-title" hidden data-chat-panel>
    <div class="m-chat__head">
      <span class="m-chat__avatar"><img src="/wp-content/uploads/chat-avatar.png" alt="" width="512" height="512" decoding="async" loading="lazy"><span class="m-chat__online" aria-hidden="true"></span></span>
      <div>
        <p class="m-chat__title" id="chat-title">Chat with the Pros</p>
        <p class="m-chat__sub">Messages go straight to our phone</p>
      </div>
      <button class="m-chat__close" type="button" aria-label="Close chat" data-chat-close><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
    <div class="m-chat__body">
      <div class="m-chat__bubble">Hi! How can we help with your aquarium today?</div>
      <div class="m-chat__topics" role="group" aria-label="Pick a topic">
        <button type="button" data-chat-topic="Scratch removal">Scratch removal</button>
        <button type="button" data-chat-topic="Glass tanks">Glass tanks</button>
        <button type="button" data-chat-topic="Custom build">Custom build</button>
        <button type="button" data-chat-topic="Maintenance">Maintenance</button>
        <button type="button" data-chat-topic="Emergency">Emergency</button>
      </div>
      <form class="m-chat__form" data-chat-form>
        <label class="sr-only" for="chat-message">Your message</label>
        <textarea id="chat-message" name="message" rows="3" placeholder="Type your message&hellip;" data-chat-message></textarea>
        <p class="m-chat__hint" data-chat-hint hidden>Type a message or pick a topic first.</p>
        <div class="m-chat__send">
          <button class="m-chat__btn -whatsapp" type="submit" data-chat-via="whatsapp"><svg class="a-svg" aria-hidden="true"><use href="#i-whatsapp"/></svg>WhatsApp</button>
          <button class="m-chat__btn -sms" type="submit" data-chat-via="sms"><svg class="a-svg" aria-hidden="true"><use href="#i-contact"/></svg>Text us</button>
        </div>
      </form>
    </div>
    <div class="m-chat__foot">
      <a href="tel:+15625660150"><svg class="a-svg" aria-hidden="true"><use href="#i-phone"/></svg>Call +1 (562) 566-0150</a>
      <a href="/quote/">Request a quote</a>
    </div>
  </div>
  <p class="m-chat__nudge" hidden data-chat-nudge>Questions? <strong>Chat with the Pros</strong></p>
  <button class="m-chat__launcher" type="button" aria-expanded="false" aria-controls="chat-panel" aria-label="Chat with us" data-chat-toggle>
    <span class="m-chat__bubbles" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <svg class="m-chat__fish" viewBox="0 0 120 90" aria-hidden="true">
      <defs>
        <linearGradient id="fish-body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e2bd6c"/><stop offset=".55" stop-color="#c79d47"/><stop offset="1" stop-color="#a47a2c"/>
        </linearGradient>
        <linearGradient id="fish-fin" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#1b5a95"/><stop offset="1" stop-color="#00284d"/>
        </linearGradient>
      </defs>
      <g class="m-chat__tail"><path d="M30 45 6 24c-3-2-6 0-5 4l6 17-6 17c-1 4 2 6 5 4z" fill="url(#fish-fin)"/></g>
      <path d="M52 22c6-12 20-16 30-12-6 3-9 8-10 14z" fill="url(#fish-fin)"/>
      <path d="M56 66c4 9 14 12 22 9-5-2-7-6-8-11z" fill="url(#fish-fin)"/>
      <ellipse cx="68" cy="45" rx="42" ry="27" fill="url(#fish-body)"/>
      <path d="M58 20c-6 8-8 17-8 25s2 17 8 25" fill="none" stroke="#00284d" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
      <path d="M72 19c-5 8-7 17-7 26s2 18 7 26" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
      <circle cx="92" cy="38" r="8" fill="#fff"/><circle class="m-chat__pupil" cx="94" cy="38" r="4.2" fill="#00284d"/><circle cx="95.5" cy="36.4" r="1.3" fill="#fff"/>
      <path d="M100 53c3 2 6 2 8 0" fill="none" stroke="#00284d" stroke-width="2.4" stroke-linecap="round"/>
      <g class="m-chat__dots"><rect x="36" y="40" width="30" height="16" rx="8" fill="#00284d"/><circle cx="44" cy="48" r="2.2" fill="#fff"/><circle cx="51" cy="48" r="2.2" fill="#fff"/><circle cx="58" cy="48" r="2.2" fill="#fff"/></g>
    </svg>
    <span class="m-chat__launcherLabel">Chat with us</span>
  </button>
</div>
